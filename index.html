<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boston's Top Ten 311 Calls in 2025</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <main>
    <header>
      <h1>Boston's Top Ten 311 Calls in 2025</h1>
      <p class="subheader">Y axis: Call Reason X-axis: # of calls</p>
      <p>Data: <code>boston_311_2025_by_reason.csv</code> — showing the top reasons by count</p>
    </header>

    <section id="chart-wrapper">
      <div class="controls">
        <button id="toggle-btn">Show full chart</button>
      </div>
      <div id="chart"></div>
      <div id="attribution">boston 2025 311 datasource</div>
    </section>
  </main>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
